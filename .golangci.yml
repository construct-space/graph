version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck      # missing error returns
    - govet         # stdlib vet checks
    - ineffassign   # dead assignments
    - staticcheck   # catches common mistakes + style
    - unused        # unreachable identifiers
    - misspell      # common English typos
    - unconvert     # redundant type conversions
    - bodyclose     # http.Response.Body closes

  settings:
    errcheck:
      # Ignoring the error on these calls is idiomatic:
      # - Close() on any io.Closer / os.File / http body — best-effort cleanup
      # - ResponseWriter.Write — error means client hung up; response is already committed
      # - os.Setenv in env-file loaders — falls back to defaults silently
      # - os.Remove / RemoveAll / MkdirAll — cleanup/scaffolding in tempdirs
      # - fmt.Fprintf on ResponseWriter — HTML fallback pages; same as Write above
      exclude-functions:
        # .Close() — always best-effort cleanup (file/gzip/tar/http body…)
        - (io.Closer).Close
        - (*os.File).Close
        - (*net/http.Response).Body.Close
        - (*net/http.Request).Body.Close
        - (*compress/gzip.Reader).Close
        - (*compress/gzip.Writer).Close
        - (*archive/tar.Writer).Close
        # DB cleanup — same rationale as io.Closer; errcheck doesn't infer
        # the interface, so list concrete types.
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        # sql.Row/Rows.Scan — inside for-rows.Next loops, continuing on a
        # scan err is the idiomatic recovery path; Row.Scan is one-shot and
        # the calling code validates the decoded fields afterwards.
        - (*database/sql.Rows).Scan
        - (*database/sql.Row).Scan
        # http.Server graceful shutdown — best-effort inside signal handler.
        - (*net/http.Server).Shutdown
        # ResponseWriter: response already committed; client-hangup isn't actionable
        - (net/http.ResponseWriter).Write
        # Env-file loaders: values always fallback to defaults
        - os.Setenv
        # FS scaffolding / cleanup in tempdirs
        - os.Remove
        - os.RemoveAll
        - os.MkdirAll
        # HTML fallback responses — same rationale as Write above
        - fmt.Fprintf
        - fmt.Fprintln
        # JSON serialization to ResponseWriter, or decodes into structs
        # whose fields the caller validates afterwards.
        - (*encoding/json.Encoder).Encode
        - (*encoding/json.Decoder).Decode
        - encoding/json.Unmarshal

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      # Style quickfixes in tests are noise — tests are read line-by-line,
      # not refactored for elegance.
      - path: _test\.go
        linters: [staticcheck]
        text: "QF1001"
      # aws-sdk-go v1 is deprecated upstream; migration to v2 tracked separately
      - path: internal/storage/r2\.go
        linters: [staticcheck]
        text: "SA1019"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
